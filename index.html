<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Cyber Chief Tetris</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
</head>
<body>
    <div id="game-container"></div>
    <div id="ui-layer">
        <div id="score-container">
            <div>SCORE: <span id="score">0</span></div>
            <div>BEST: <span id="best">0</span></div>
        </div>
    </div>
    <div id="controls">
        <div class="control-group">
            <button class="btn rotate" id="btn-rotate">ROT</button>
        </div>
        <div class="control-group dpad">
            <button class="btn up" id="btn-up">↑</button>
            <button class="btn left" id="btn-left">←</button>
            <button class="btn down" id="btn-down">↓</button>
            <button class="btn right" id="btn-right">→</button>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
