<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Survival Tetris - 部長モード搭載</title>
    <style>
        body {
            background: #202028;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            overflow: hidden;
            height: 100vh;
            touch-action: manipulation;
        }
        #ui-top {
            width: 300px;
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            font-size: 18px;
        }
        #game-container {
            position: relative;
            border: 2px solid #fff;
        }
        canvas {
            display: block;
            background-color: #000;
        }
        /* メッセージ表示 */
        #message-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 40px;
            font-weight: bold;
            color: #ff0000;
            text-align: center;
            white-space: nowrap;
            display: none;
            z-index: 10;
            text-shadow: 2px 2px #fff;
        }
        /* コントローラー */
        #controls {
            width: 100%;
            max-width: 400px;
            display: flex;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
        }
        .btn {
            background: #444;
            color: white;
            border: none;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }
        .btn:active { background: #666; }
        .d-pad {
            display: grid;
            grid-template-columns: 60px 60px 60px;
            grid-template-rows: 60px 60px;
        }
        #btn-start {
            margin-top: 10px;
            padding: 10px 20px;
            font-size: 18px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
        }
    </style>
</head>
<body>

<div id="ui-top">
    <div>Score: <span id="score">0</span></div>
    <div>Best: <span id="best">0</span></div>
</div>

<div id="game-container">
    <canvas id="tetris" width="240" height="400"></canvas>
    <div id="message-overlay"></div>
</div>

<button id="btn-start">GAME START</button>

<div id="controls">
    <div id="rotate-zone">
        <button class="btn" id="btn-rotate">回転</button>
    </div>
    <div class="d-pad">
        <div></div><button class="btn" id="btn-up">↑</button><div></div>
        <button class="btn" id="btn-left">←</button><button class="btn" id="btn-down">↓</button><button class="btn" id="btn-right">→</button>
    </div>
</div>

<script>
const canvas = document.getElementById('tetris');
const context = canvas.getContext('2d');
const scoreElement = document.getElementById('score');
const bestElement = document.getElementById('best');
const msgOverlay = document.getElementById('message-overlay');

context.scale(20, 20);

// 通常のテトリミノ
const SHAPES = 'ILJOTSZ';
const COLORS = [null, '#FF0D72', '#0DC2FF', '#0DFF72', '#F538FF', '#FF8E0D', '#FFE138', '#3877FF'];

// 部長モード用のカオスな形状
const CHIEF_SHAPES = [
    [[1,1,1,1,1]], // 超ロング
    [[1,1],[1,1],[1,1]], // 縦長
    [[1,1,1],[0,1,0],[0,1,0]], // 十字
    [[1,0,1],[1,1,1],[1,0,1]], // H型
    [[1,1,1,1],[1,1,1,1]] // 巨大ブロック
];

let arena = createMatrix(12, 20);
let player = { pos: {x: 0, y: 0}, matrix: null, score: 0 };
let dropCounter = 0;
let dropInterval = 1000;
let lastTime = 0;
let isGameOver = true;
let isChiefMode = false;
let chiefEventTriggered = false;
let gameStartTime = 0;
let isPaused = false;

function createMatrix(w, h) {
    const matrix = [];
    while (h--) matrix.push(new Array(w).fill(0));
    return matrix;
}

function createPiece(type) {
    if (type === 'I') return [[0, 1, 0, 0], [0, 1, 0, 0], [0, 1, 0, 0], [0, 1, 0, 0]];
    if (type === 'L') return [[0, 2, 0], [0, 2, 0], [0, 2, 2]];
    if (type === 'J') return [[0, 3, 0], [0, 3, 0], [3, 3, 0]];
    if (type === 'O') return [[4, 4], [4, 4]];
    if (type === 'T') return [[0, 5, 0], [5, 5, 5], [0, 0, 0]];
    if (type === 'S') return [[0, 6, 6], [6, 6, 0], [0, 0, 0]];
    if (type === 'Z') return [[7, 7, 0], [0, 7, 7], [0, 0, 0]];
}

// 部長モード用：見たことない形状を生成
function createChaosPiece() {
    const shape = CHIEF_SHAPES[Math.floor(Math.random() * CHIEF_SHAPES.length)];
    const colorIdx = Math.floor(Math.random() * (COLORS.length - 1)) + 1;
    return shape.map(row => row.map(v => v ? colorIdx : 0));
}

function draw() {
    context.fillStyle = '#000';
    context.fillRect(0, 0, canvas.width, canvas.height);
    drawMatrix(arena, {x: 0, y: 0});
    drawMatrix(player.matrix, player.pos);
}

function drawMatrix(matrix, offset) {
    matrix.forEach((row, y) => {
        row.forEach((value, x) => {
            if (value !== 0) {
                context.fillStyle = COLORS[value] || '#fff';
                context.fillRect(x + offset.x, y + offset.y, 1, 1);
            }
        });
    });
}

function merge(arena, player) {
    player.matrix.forEach((row, y) => {
        row.forEach((value, x) => {
            if (value !== 0) arena[y + player.pos.y][x + player.pos.x] = value;
        });
    });
}

function playerDrop() {
    if(isPaused) return;
    player.pos.y++;
    if (collide(arena, player)) {
        player.pos.y--;
        merge(arena, player);
        playerReset();
        arenaSweep();
        updateScore();
    }
    dropCounter = 0;
}

function playerMove(dir) {
    if(isPaused) return;
    player.pos.x += dir;
    if (collide(arena, player)) player.pos.x -= dir;
}

function playerRotate() {
    if(isPaused) return;
    const pos = player.pos.x;
    let offset = 1;
    rotate(player.matrix);
    while (collide(arena, player)) {
        player.pos.x += offset;
        offset = -(offset + (offset > 0 ? 1 : -1));
        if (offset > player.matrix[0].length) {
            rotate(player.matrix, -1);
            player.pos.x = pos;
            return;
        }
    }
}

function rotate(matrix, dir = 1) {
    for (let y = 0; y < matrix.length; ++y) {
        for (let x = 0; x < y; ++x) {
            [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
        }
    }
    if (dir > 0) matrix.forEach(row => row.reverse());
    else matrix.reverse();
}

function collide(arena, player) {
    const [m, o] = [player.matrix, player.pos];
    for (let y = 0; y < m.length; ++y) {
        for (let x = 0; x < m[y].length; ++x) {
            if (m[y][x] !== 0 && (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) return true;
        }
    }
    return false;
}

function arenaSweep() {
    let rowCount = 1;
    outer: for (let y = arena.length - 1; y > 0; --y) {
        for (let x = 0; x < arena[y].length; ++x) {
            if (arena[y][x] === 0) continue outer;
        }
        const row = arena.splice(y, 1)[0].fill(0);
        arena.unshift(row);
        ++y;
        player.score += rowCount * 10;
        rowCount *= 2;
    }
}

function playerReset() {
    if (isChiefMode && chiefEventTriggered) {
        player.matrix = createChaosPiece();
    } else {
        player.matrix = createPiece(SHAPES[SHAPES.length * Math.random() | 0]);
    }
    player.pos.y = 0;
    player.pos.x = (arena[0].length / 2 | 0) - (player.matrix[0].length / 2 | 0);
    if (collide(arena, player)) {
        gameOver();
    }
}

function updateScore() {
    scoreElement.innerText = player.score;
    if (player.score > parseInt(bestElement.innerText)) {
        bestElement.innerText = player.score;
        localStorage.setItem('tetrisBest', player.score);
    }
}

function gameOver() {
    isGameOver = true;
    alert("GAME OVER! Score: " + player.score);
    arena.forEach(row => row.fill(0));
    player.score = 0;
    updateScore();
}

function update(time = 0) {
    if (isGameOver || isPaused) {
        requestAnimationFrame(update);
        return;
    }

    const deltaTime = time - lastTime;
    lastTime = time;

    // 5秒ごとに速度上昇 (最低100ms)
    const elapsed = (time - gameStartTime) / 1000;
    dropInterval = Math.max(100, 1000 - Math.floor(elapsed / 5) * 100);

    // 部長モードイベントチェック
    if (isChiefMode && !chiefEventTriggered && elapsed > 7) {
        triggerChiefEvent();
    }

    dropCounter += deltaTime;
    if (dropCounter > dropInterval) {
        playerDrop();
    }

    draw();
    requestAnimationFrame(update);
}

function triggerChiefEvent() {
    chiefEventTriggered = true;
    isPaused = true;

    // 1.5秒明滅して消滅
    let blinkCount = 0;
    const blinkInterval = setInterval(() => {
        canvas.style.visibility = (canvas.style.visibility === 'hidden' ? 'visible' : 'hidden');
        blinkCount++;
        if (blinkCount > 6) {
            clearInterval(blinkInterval);
            canvas.style.visibility = 'visible';
            arena.forEach(row => row.fill(0)); // 全消去
            draw();
            
            // 1秒後にメッセージ
            setTimeout(() => {
                msgOverlay.innerText = "腹括れや！！";
                msgOverlay.style.display = "block";
                
                // 2秒後に再開
                setTimeout(() => {
                    msgOverlay.style.display = "none";
                    isPaused = false;
                    playerReset();
                }, 2000);
            }, 1000);
        }
    }, 200);
}

// 初期化
bestElement.innerText = localStorage.getItem('tetrisBest') || 0;

document.getElementById('btn-start').addEventListener('click', () => {
    isGameOver = false;
    isPaused = false;
    chiefEventTriggered = false;
    player.score = 0;
    updateScore();
    arena.forEach(row => row.fill(0));
    
    // 部長モード抽選 (5%)
    isChiefMode = Math.random() < 0.05;
    if(isChiefMode) console.log("部長モード：ON");
    
    gameStartTime = performance.now();
    playerReset();
    update();
    document.getElementById('btn-start').blur();
});

// コントローラー
document.getElementById('btn-left').addEventListener('touchstart', (e) => { e.preventDefault(); playerMove(-1); });
document.getElementById('btn-right').addEventListener('touchstart', (e) => { e.preventDefault(); playerMove(1); });
document.getElementById('btn-down').addEventListener('touchstart', (e) => { e.preventDefault(); playerDrop(); });
document.getElementById('btn-up').addEventListener('touchstart', (e) => { e.preventDefault(); /* ハードドロップ等に割り当て可 */ });
document.getElementById('btn-rotate').addEventListener('touchstart', (e) => { e.preventDefault(); playerRotate(); });

// PCでも確認できるようにキーボード対応
document.addEventListener('keydown', event => {
    if (event.keyCode === 37) playerMove(-1);
    else if (event.keyCode === 39) playerMove(1);
    else if (event.keyCode === 40) playerDrop();
    else if (event.keyCode === 38) playerRotate();
});

</script>
</body>
</html>
