<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Cyber Chief Tetris - Overdrive</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
</head>
<body>
    <div id="game-container"></div>
    <div id="ui-overlay">
        <div class="score-box">
            <div class="label">SCORE</div>
            <div id="score" class="value">0</div>
        </div>
        <div class="score-box">
            <div class="label">BEST</div>
            <div id="best" class="value">0</div>
        </div>
    </div>
    <div id="controls">
        <button class="btn rotate" id="btn-rotate">ROT</button>
        <div class="dpad">
            <button class="btn up" id="btn-up">↑</button>
            <button class="btn left" id="btn-left">←</button>
            <button class="btn down" id="btn-down">↓</button>
            <button class="btn right" id="btn-right">→</button>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
